<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廚房看板 — Zorya 練習 Demo</title>
<meta name="description" content="掃碼點餐系統的廚房顯示看板，透過 BroadcastChannel／localStorage 即時同步顯示訂單。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ctext x='32' y='45' font-family='Georgia, Cambria, serif' font-size='34' font-weight='700' fill='%233987e5' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/portfolio-theme.css">
<style>
  /* Kitchen board: optimized for at-a-glance legibility from across a room.
     Colors/spacing are pulled from the shared design tokens; 內用/外帶
     reuse the shared semantic --good / --warn colors instead of bespoke hues. */
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);
    background:var(--surface-page);color:var(--ink-primary);min-height:100vh}

  .board-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
    background:var(--surface-raised);border-bottom:1px solid var(--gridline)}
  .board-title{margin:0;font-size:20px;font-weight:800;font-family:var(--font-sans);display:flex;align-items:center;gap:10px}
  .board-title small{color:var(--ink-muted);font-weight:500;font-size:13px}
  .right{display:flex;align-items:center;gap:var(--space-3)}
  .clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
  .clear{background:transparent;border:1px solid var(--border-strong);color:var(--ink-muted);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
  .clear:hover{border-color:var(--accent)}
  .stat{font-size:13px;color:var(--ink-muted)}
  .stat b{color:var(--ink-primary);font-size:16px}

  .board{padding:var(--space-3) 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .empty{color:var(--ink-muted);text-align:center;padding:80px 20px;grid-column:1/-1}
  .empty .em{font-size:48px}

  .ticket{background:var(--surface-card);border:1px solid var(--gridline);border-radius:var(--radius-md);overflow:hidden;
    box-shadow:var(--shadow-card);animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .thead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:800}
  .thead.dine{background:linear-gradient(90deg,var(--good-soft),transparent);border-left:4px solid var(--good)}
  .thead.take{background:linear-gradient(90deg,var(--warn-soft),transparent);border-left:4px solid var(--warn)}
  .place{font-size:19px}
  .time{font-size:14px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .tbody{padding:6px 16px 16px}
  .line{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--gridline);font-size:15px}
  .line:last-child{border:none}
  .tag{font-size:11px;color:var(--ink-muted);min-width:34px}
  .no{font-size:44px;font-weight:900;color:var(--gridline);text-align:right;line-height:.8;margin:-6px 16px 8px 0}
  .badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
  .badge.dine{background:var(--good-soft);color:var(--good)}
  .badge.take{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../../index.html">Zorya<span>練習 Demo</span></a>
    <button class="theme-toggle" id="themeToggle" aria-label="切換深色／淺色模式">◐</button>
  </div>
</header>

<div class="board-header">
  <h1 class="board-title">👨‍🍳 廚房訂單看板 <small>即時顯示</small></h1>
  <div class="right">
    <div class="stat">今日訂單 <b id="cnt">0</b></div>
    <div class="clock" id="clock">--:--</div>
    <button class="clear" onclick="clearAll()">清空</button>
  </div>
</div>
<div class="board" id="board"></div>

<script src="../../assets/portfolio-theme.js"></script>
<script>
const $=id=>document.getElementById(id);
let orders = JSON.parse(localStorage.getItem('orders')||'[]');

function tick(){ $('clock').textContent=new Date().toTimeString().slice(0,5); }
tick(); setInterval(tick,1000*10);

function render(){
  const b=$('board');
  $('cnt').textContent=orders.length;
  if(orders.length===0){ b.innerHTML=`<div class="empty"><div class="em">🍽️</div><p>尚無訂單，等待點餐中…</p></div>`; return; }
  const sorted=[...orders].sort((a,b)=>b.ts-a.ts);
  b.innerHTML=sorted.map((o,idx)=>{
    const dine=o.type==='內用';
    const num=orders.findIndex(x=>x.id===o.id)+1;
    return `<div class="ticket">
      <div class="thead ${dine?'dine':'take'}">
        <span class="place">${dine?'🍽️ '+o.place:'🛍️ 外帶'}</span>
        <span class="badge ${dine?'dine':'take'}">${dine?'內用':'外帶'}</span>
      </div>
      <div class="no">#${String(num).padStart(2,'0')}</div>
      <div class="tbody">
        <div class="line"><span class="tag">時間</span><b>${o.time}</b></div>
        <div class="line"><span class="tag">飯</span>${o.rice}</div>
        <div class="line"><span class="tag">主食</span><b>${o.main}</b></div>
        <div class="line"><span class="tag">三菜</span>${o.sides.join('、')}</div>
      </div>
    </div>`;
  }).join('');
}

function add(rec){
  if(orders.some(o=>o.id===rec.id)) return;
  orders.push(rec);
  localStorage.setItem('orders',JSON.stringify(orders));
  render();
}
window.clearAll=()=>{ if(confirm('清空所有訂單？')){ orders=[]; localStorage.setItem('orders','[]'); render(); } };

// 即時接收（同瀏覽器跨分頁）
try{ const bc=new BroadcastChannel('order-demo'); bc.onmessage=e=>add(e.data); }catch(e){}
// 備援：localStorage 事件（其他分頁寫入時觸發）
window.addEventListener('storage',e=>{ if(e.key==='orders'){ syncFromStore(); } });
// 保險：每 1.5 秒輪詢 localStorage，確保 file:// 直接開啟也能同步
function syncFromStore(){
  const latest=JSON.parse(localStorage.getItem('orders')||'[]');
  if(latest.length!==orders.length){ orders=latest; render(); }
}
setInterval(syncFromStore,1500);

render();
</script>
</body>
</html>
