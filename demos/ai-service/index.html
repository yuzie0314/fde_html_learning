<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>電商 AI 客服 — Zorya Demo</title>
<meta name="description" content="電商 AI 客服對話介面Demo：即時回覆訂單、退換貨、運費等常見問題，並可選擇語音朗讀回覆內容。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ctext x='32' y='45' font-family='Georgia, Cambria, serif' font-size='34' font-weight='700' fill='%233987e5' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/portfolio-theme.css">
<style>
  /* ---------- page-scoped: demo shell ---------- */
  .demo-shell{
    display:flex; flex-direction:column; align-items:center;
    padding-top:var(--space-5); padding-bottom:var(--space-7); gap:var(--space-4);
  }
  .demo-intro{ max-width:60ch; text-align:center; }
  .demo-intro p{ margin-top:var(--space-2); font-size:15px; color:var(--ink-secondary); }

  /* ---------- page-scoped: chat widget (bespoke visual design, token-driven) ---------- */
  .phone{
    --brand: #9db49a;
    --brand-ink: #2b2925;
    width:100%; max-width:400px; height:min(760px,80vh);
    background:var(--surface-card); border-radius:26px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow-card); border:1px solid var(--gridline);
  }
  .top{
    background:var(--brand);
    color:var(--brand-ink); padding:14px 18px; display:flex; align-items:center; gap:14px; flex-shrink:0;
  }
  .av{width:69px;height:69px;border-radius:50%;background:#f4f3ee;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;border:2px solid rgba(255,255,255,.85);padding:0;cursor:pointer;overflow:hidden;flex:none;transition:transform .15s ease}
  .av:hover{transform:scale(1.06)} .av:active{transform:scale(.94)}
  .av-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .av-cat{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:cover;background:#f4f3ee;transform:scale(1.12)}
  .av-cat[hidden]{display:none}
  .av .dot{z-index:2}
  @keyframes catpop{0%{transform:scale(.6) rotate(-8deg)}70%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1.12)}}
  .av-cat.pop{animation:catpop .35s ease-out}
  .av .dot{position:absolute;right:4px;bottom:4px;width:14px;height:14px;border-radius:50%;background:#7fa66f;border:2px solid #f4f3ee}
  .top .nm{font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:.02em}
  .top .st{font-size:11px;opacity:.72}
  .voice{margin-left:auto;background:rgba(43,41,37,.10);border:none;color:var(--brand-ink);font-size:12px;
    padding:8px 11px;border-radius:20px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:5px}
  .voice.off{opacity:.55}
  .chat{flex:1;overflow-y:auto;padding:18px 16px;background:color-mix(in srgb,var(--brand) 12%,var(--surface-page));display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bot{align-self:flex-start;background:var(--surface-raised);border:1px solid var(--gridline);border-bottom-left-radius:5px;color:var(--ink-primary)}
  .me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
  .time{font-size:10px;color:var(--ink-muted);margin:2px 4px 0}
  .me + .time{align-self:flex-end}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:92%}
  .chip{background:var(--surface-raised);border:1.5px solid color-mix(in srgb,var(--brand) 70%,var(--border-strong));color:var(--ink-secondary);font-size:13px;font-weight:600;
    padding:8px 13px;border-radius:20px;cursor:pointer;transition:.12s}
  .chip:hover{background:color-mix(in srgb,var(--brand) 25%,var(--surface-raised))} .chip:active{transform:scale(.96)}
  .typing{align-self:flex-start;background:var(--surface-raised);border:1px solid var(--gridline);padding:13px 16px;border-radius:16px;border-bottom-left-radius:5px;display:flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-muted);animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .foot{border-top:1px solid var(--gridline);padding:10px 12px;display:flex;gap:8px;align-items:center;background:var(--surface-raised);flex-shrink:0}
  .foot input{flex:1;border:1.5px solid var(--gridline);border-radius:22px;padding:11px 15px;font-size:15px;outline:none;background:var(--surface-page);color:var(--ink-primary);font-family:inherit}
  .foot input:focus{border-color:var(--brand)}
  .send{width:44px;height:44px;border-radius:50%;border:none;background:var(--brand);color:var(--brand-ink);font-size:18px;cursor:pointer;flex:none}
  .customize{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;padding:14px 16px;background:var(--surface-card);border:1px solid var(--gridline);border-radius:14px}
  .cz-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .cz-label{font-size:12px;font-weight:700;color:var(--ink-muted);letter-spacing:.04em;min-width:48px}
  .swatches,.cat-picks{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--border-strong);transition:transform .12s}
  .swatch:hover{transform:scale(1.1)} .swatch.on{border-color:var(--ink-primary)}
  .cat-pick{width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:0;background:#f4f3ee;overflow:hidden;cursor:pointer;transition:transform .12s}
  .cat-pick img{width:100%;height:100%;image-rendering:pixelated;transform:scale(1.12)}
  .cat-pick:hover{transform:scale(1.1)} .cat-pick.on{border-color:var(--ink-primary)}
  .cz-hint{font-size:11.5px;color:var(--ink-muted)}
  .badge{font-size:9px;text-align:center;color:var(--ink-muted);padding:4px;background:var(--surface-card);flex-shrink:0}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../index.html">Zorya<span>FDE &amp; Data Scientist</span></a>
    <div style="display:flex;align-items:center;">
      <button class="theme-toggle" id="themeToggle" aria-label="切換深色／淺色模式">◐</button>
    </div>
  </div>
</header>

<main class="wrap demo-shell">
  <div class="demo-intro reveal">
    <div class="eyebrow">Demo・對話介面</div>
    <p>電商情境的 AI 客服對話練習：即時回覆訂單物流、退換貨、運費、付款等常見問題，可切換語音朗讀回覆內容。</p>
  </div>

  <div class="phone reveal">
    <div class="top">
      <button class="av" id="avatar" type="button" title="點一下換一隻貓" aria-label="換一隻客服貓"><span class="av-emoji" aria-hidden="true">🐱</span><img class="av-cat" id="avatarImg" alt="小雲客服貓" width="128" height="128" hidden><span class="dot"></span></button>
      <div><div class="nm">小雲 AI 客服</div><div class="st">線上・平均 2 秒回覆</div></div>
      <button class="voice" id="voice">🔊 語音</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="foot">
      <input id="inp" placeholder="輸入問題，或點下方按鈕…" autocomplete="off">
      <button class="send" id="send">➤</button>
    </div>
    <div class="badge">AI 客服 Demo・示範用（可串接真實訂單系統與大型語言模型）</div>
  </div>

  <div class="customize reveal" aria-label="外觀設定">
    <div class="cz-group"><span class="cz-label">主題色</span><div class="swatches" id="swatches"></div></div>
    <div class="cz-group"><span class="cz-label">客服貓</span><div class="cat-picks" id="catPicks"></div></div>
    <div class="cz-hint">委託人可自行挑選品牌色與客服角色；選擇會記在這台裝置上。</div>
  </div>
</main>

<script src="../../assets/portfolio-theme.js"></script>
<script>
const chat=document.getElementById('chat');

// ---- 外觀客製：品牌色 + 客服貓（選擇記在 localStorage；缺圖時退回 emoji） ----
const THEMES=[{n:'鼠尾草',c:'#9db49a'},{n:'霧藍',c:'#9fb4c7'},{n:'奶茶',c:'#cdb59b'},{n:'乾燥玫瑰',c:'#d3a6a6'},{n:'薰衣草',c:'#b4a9cb'},{n:'燕麥',c:'#c9c2b2'}];
const CATS=['img/cat-1.png','img/cat-2.png','img/cat-3.png','img/cat-4.png','img/cat-5.png','img/cat-6.png'];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const phone=document.querySelector('.phone');
const avImg=document.getElementById('avatarImg');
let catIdx=parseInt(store.get('ai-service-cat'),10);
if(isNaN(catIdx))catIdx=Math.floor(Math.random()*CATS.length);

function applyTheme(i){
  const t=THEMES[i]||THEMES[0];
  phone.style.setProperty('--brand',t.c);
  document.querySelectorAll('.swatch').forEach((b,j)=>b.classList.toggle('on',j===i));
  store.set('ai-service-theme',String(i));
}
function showCat(i){
  catIdx=i;
  const img=new Image();
  img.onload=()=>{avImg.src=img.src;avImg.hidden=false;avImg.classList.remove('pop');void avImg.offsetWidth;avImg.classList.add('pop');};
  img.onerror=()=>{avImg.hidden=true;};
  img.src=CATS[i];
  document.querySelectorAll('.cat-pick').forEach((b,j)=>b.classList.toggle('on',j===i));
  store.set('ai-service-cat',String(i));
}
const sw=document.getElementById('swatches');
THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='swatch';b.type='button';b.title=t.n;b.setAttribute('aria-label',t.n);b.style.background=t.c;b.onclick=()=>applyTheme(i);sw.appendChild(b);});
const cp=document.getElementById('catPicks');
CATS.forEach((src,i)=>{const b=document.createElement('button');b.className='cat-pick';b.type='button';b.title='客服貓 '+(i+1);b.setAttribute('aria-label','客服貓 '+(i+1));
  const im=new Image();im.src=src;im.alt='';im.onerror=()=>b.remove();b.appendChild(im);b.onclick=()=>showCat(i);cp.appendChild(b);});
applyTheme(parseInt(store.get('ai-service-theme'),10)||0);
showCat(catIdx);
document.getElementById('avatar').onclick=()=>showCat((catIdx+1)%CATS.length);
let voiceOn=true;

const INTENTS=[
  {keys:["訂單","物流","到貨","到哪","出貨","包裹","查件","運送","幾天","什麼時候到"],
   a:"您可以提供訂單編號，我立即為您查詢物流進度 📦\n（示範）訂單 #A20260704 目前狀態：已出貨，預計 7/6 送達，宅配單號 8842-1176-33。",
   chips:["我要退換貨","運費怎麼算","轉真人客服"]},
  {keys:["退","換貨","退貨","退款","不想要","瑕疵","壞掉"],
   a:"退換貨說明如下 🔁\n・鑑賞期 7 天內、商品完整可申請\n・生鮮/客製商品恕不退換\n・退款於收到退回商品後 3～5 個工作天原路退回\n需要我幫您開啟退貨申請嗎？",
   chips:["開啟退貨申請","查詢我的訂單","轉真人客服"]},
  {keys:["運費","運送費","免運","多少錢寄","寄送費用"],
   a:"運費資訊 🚚\n・本島宅配 NT$80，滿 NT$1,200 免運\n・超商取貨 NT$60，滿 NT$900 免運\n・離島另計。要幫您看目前購物車是否達免運嗎？",
   chips:["查詢我的訂單","付款方式","轉真人客服"]},
  {keys:["規格","尺寸","顏色","庫存","有貨","現貨","材質","size"],
   a:"商品規格與庫存 🛍️\n請告訴我商品名稱或連結，我可查詢即時庫存與可選規格。\n（示範）「經典帆布包」現貨：黑/卡其/藍，均有庫存。",
   chips:["運費怎麼算","付款方式","查詢我的訂單"]},
  {keys:["付款","付費","刷卡","信用卡","分期","匯款","貨到付款","超商代碼","line pay","付錢"],
   a:"付款方式 💳\n・信用卡（可 3/6 期分期）\n・LINE Pay / Apple Pay\n・超商代碼繳費\n・貨到付款（本島限定）",
   chips:["運費怎麼算","查詢我的訂單","轉真人客服"]},
  {keys:["時間","營業","客服時間","幾點","上班","服務時間"],
   a:"客服服務時間 🕘\n・AI 客服：24 小時全年無休\n・真人客服：週一至週五 10:00–18:00\n非服務時間我也會先幫您記錄，專員上線後回覆您。",
   chips:["轉真人客服","查詢我的訂單"]},
  {keys:["真人","專員","客服人員","找人","不要機器人","轉接"],
   a:"好的，我已為您轉接真人客服 👩‍💼\n（示範）目前等候人數 2 位，預計 3 分鐘內由專員接手。方便先留下您的訂單編號與問題摘要嗎？",
   chips:["查詢我的訂單","我要退換貨"]},
  {keys:["謝謝","感謝","thank","了解","好的","ok"],
   a:"不客氣！很高興能幫上忙 😊 還有其他需要協助的地方嗎？",
   chips:["查詢我的訂單","我要退換貨","運費怎麼算"]},
  {keys:["你好","哈囉","hi","hello","在嗎","嗨"],
   a:"您好，我是小雲 AI 客服 🐾 很高興為您服務！以下是常見問題，也可以直接打字問我：",
   chips:["查詢我的訂單","我要退換貨","運費怎麼算","付款方式"]},
];
const FALLBACK={a:"這個問題我先幫您記下來了 📝 我可以協助訂單物流、退換貨、運費、付款、商品規格等問題；較複雜的部分也能為您轉接真人客服。您想先了解哪一項？",
  chips:["查詢我的訂單","我要退換貨","運費怎麼算","轉真人客服"]};

function now(){return new Date().toTimeString().slice(0,5);}
function scroll(){chat.scrollTop=chat.scrollHeight;}

function addMe(t){
  const d=document.createElement('div');d.className='msg me';d.textContent=t;chat.appendChild(d);
  const tm=document.createElement('div');tm.className='time';tm.textContent=now();chat.appendChild(tm);scroll();
}
function typing(){const d=document.createElement('div');d.className='typing';d.id='typing';d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);scroll();return d;}

function speak(t){
  if(!voiceOn||!window.speechSynthesis)return;
  const clean=t.replace(/[📦🔁🚚🛍️💳🕘👩‍💼😊🤖🐾📝➤・]/g,' ');
  const u=new SpeechSynthesisUtterance(clean);u.lang='zh-TW';u.rate=1.05;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function addBot(t,chips){
  const d=document.createElement('div');d.className='msg bot';d.textContent=t;chat.appendChild(d);
  const tm=document.createElement('div');tm.className='time';tm.textContent=now();chat.appendChild(tm);
  if(chips&&chips.length){
    const c=document.createElement('div');c.className='chips';
    chips.forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{addMe(x);respond(x);};c.appendChild(b);});
    chat.appendChild(c);
  }
  scroll();speak(t);
}
function match(text){
  const t=text.toLowerCase();
  let best=null,score=0;
  for(const it of INTENTS){
    const s=it.keys.reduce((n,k)=>n+(t.includes(k.toLowerCase())?1:0),0);
    if(s>score){score=s;best=it;}
  }
  return score>0?best:FALLBACK;
}
function respond(text){
  const t=typing();
  setTimeout(()=>{t.remove();const r=match(text);addBot(r.a,r.chips);},700+Math.random()*500);
}
function submit(){
  const v=document.getElementById('inp').value.trim();if(!v)return;
  document.getElementById('inp').value='';addMe(v);respond(v);
}
document.getElementById('send').onclick=submit;
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
document.getElementById('voice').onclick=function(){
  voiceOn=!voiceOn;this.classList.toggle('off',!voiceOn);this.textContent=voiceOn?'🔊 語音':'🔇 語音';
  if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();
};

// 開場
setTimeout(()=>addBot("您好，我是小雲 AI 客服 🐾\n很高興為您服務！請問需要什麼協助呢？以下是常見問題，也可以直接打字問我：",
  ["查詢我的訂單","我要退換貨","運費怎麼算","付款方式"]),400);
</script>
</body>
</html>
